<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6ba7a9" />
    <meta name="description" content="Plan paddocks and crop rotations with help from Manami the sheep." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet" />
    <title>Webapp Name</title>
    <script>
      // Apply the saved light/dark theme before the first paint (see src/state/prefs.js).
      (function () {
        try {
          var t = localStorage.getItem('sheeep:theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
    <style>
      :root { --app-w: 100vw; --app-h: 100dvh; }
      /* Boot loader: replaced by the app as soon as React renders into #root. */
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(#6ba7a9, #a7b394); font: 700 20px/1.3 Lato, system-ui, sans-serif; color: #372f2a; }
      .boot__lane { position: absolute; left: 0; right: 0; bottom: calc(var(--app-h) * 0.22); height: 110px; overflow: hidden; }
      .boot__ground { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--app-h) * 0.22); background: #989b66; }
      .boot__sheep { position: absolute; bottom: 0; width: 110px; height: 95px; animation: boot-run 3.2s linear infinite; }
      .boot__sheep svg { width: 100%; height: 100%; animation: boot-hop 0.36s ease-in-out infinite alternate; transform-origin: 50% 100%; }
      .boot__sheep .fx-leg { transform-box: fill-box; transform-origin: 50% 0; animation: boot-leg 0.18s ease-in-out infinite alternate; }
      .boot__msg { margin-bottom: calc(var(--app-h) * 0.14); padding: 14px 22px; border-radius: 15px; background: #ece4d4; }
      @keyframes boot-run { from { left: -130px; } to { left: 100%; } }
      @keyframes boot-hop { from { transform: translateY(0) rotate(3deg); } to { transform: translateY(-18%) rotate(-6deg); } }
      @keyframes boot-leg { from { transform: rotate(-30deg); } to { transform: rotate(30deg); } }
      @media (prefers-reduced-motion: reduce) { .boot__sheep, .boot__sheep svg, .boot__sheep .fx-leg { animation: none; } .boot__sheep { left: calc(50% - 55px); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <p class="boot__msg">Rounding up the sheep…</p>
        <div class="boot__ground"></div>
        <div class="boot__lane"><div class="boot__sheep"><!-- boot-sheep --></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
