<style>
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 18px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .stat b { display: block; font-size: 32px; font-weight: 900; line-height: 1.1; }
  .stat span { font-size: 14px; color: var(--ink-muted); }
  .resume { border: 2px solid var(--teal); }
  .resume ol { margin-bottom: 14px; }
  .resume textarea {
    width: 100%; min-height: 96px; resize: vertical; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font: 15.5px/1.5 var(--font); padding: 10px 12px;
  }
  .btn {
    border: 0; border-radius: 12px; padding: 10px 16px; font: 900 15px var(--font); cursor: pointer;
    background: var(--olive); color: #fff;
  }
  .btn:hover { filter: brightness(0.92); }
  .item { padding: 16px 18px; }
  .item h3 { font-size: 17px; margin: 6px 0 4px; }
  .item p { font-size: 15px; margin: 0 0 6px; }
  .item .where { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
  .list { display: grid; gap: 12px; }
  .q { padding: 16px 18px; border-left: 5px solid var(--gold); }
  .q h3 { font-size: 17px; margin-bottom: 4px; }
  .q p { font-size: 15px; margin: 0; color: var(--ink-muted); }
  .ms { display: grid; gap: 10px; list-style: none; padding: 0; }
  .ms li { display: grid; grid-template-columns: 34px 1fr; gap: 12px; margin: 0; }
  .ms .n { width: 34px; height: 34px; border-radius: 50%; background: var(--olive); color: #fff; font-weight: 900; display: grid; place-items: center; }
  .ms h3 { font-size: 17px; margin: 5px 0 2px; }
  .ms p { font-size: 15px; margin: 0; color: var(--ink-muted); }
  .files { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .files .card { padding: 14px 16px; }
  .files h3 { font-size: 16px; }
  .files code { display: inline-block; margin: 2px 4px 2px 0; font-size: 12.5px; }
  .session { padding: 18px 20px; }
  .session ul { font-size: 15px; margin-bottom: 8px; }
  .for-claude { font-size: 14px; }

      "what": "Read NASA HLS through Microsoft Planetary Computer",
      "why": "Free, works from the browser, and needs no login. NASA’s LP DAAC copy needs an Earthdata login."
    },
    {
      "what": "Classifier thresholds kept at the simple defaults",
      "why": "A tuned version fitted 2021 better but did worse on the held-out 2020 season (overfitting)."
    },
    {
      "what": "Snap distance measured on screen: 14 px to corners, 10 px to edges",
      "why": "Zooming in shrinks the ground distance, so real gaps between paddocks can still be drawn. Alt or the Snap switch places corners freely."
    },
    {
      "what": "Blackleg buffer 500 m, coming season only",
      "why": "Common grower guidance; spores come from last year’s stubble."
    },
    {
      "what": "Frost counted at ≤ 1 °C",
      "why": "A NASA POWER grid cell (~50 km) is milder than a cold paddock floor."
    },
    {
      "what": "“Best guess” satellite seasons are never filled in automatically",
      "why": "Cereal vs. pulse is the weakest call, so the farmer stays in control."
    },
    {
      "what": "Canola made selectable (acid tolerance 2, water need 2, acid threshold pH 6.5 in water)",
      "why": "Before this the planner never picked canola, so the blackleg feature could never show."
    },
    {
      "what": "No backend: data stays in the browser",
      "why": "localStorage for the farm and Cache Storage for satellite images and weather. Simple and private for a hackathon."
    },
    {
      "what": "Docs are visual HTML pages in docs/",
      "why": "The user is a visual person. README.md stays as the plain-text version for GitHub."
    },
    {
      "what": "Fit-to-window with CSS zoom on the whole page",
      "why": "Keeps the Figma proportions exactly and needed no rewrite of the px-based styles. Chrome scales viewport units and fixed elements consistently, and Leaflet’s clicks stay accurate (all drawing and snapping checks pass at 0.8×)."
    },
    {
      "what": "Stacked layout only at 960 px wide or narrower",
      "why": "Windows 961–1140 px wide (small laptops, tablets held sideways) fit the scaled desktop layout at ≥ 0.75×, which beats scrolling a stacked layout."
    },
    {
      "what": "Zoom range 0.62× to 1.2×",
      "why": "Below 0.62 the small text gets too small to read; above 1.2 map tiles start to look soft."
    },
    {
      "what": "Season picker is a horizontal strip, not a drag ruler",
      "why": "The user found the dragger “very bad UX”. One click reaches any season, and the crop dots show the whole rotation at a glance."
    },
    {
      "what": "Crop list is farm-wide, asked once in onboarding",
      "why": "Machinery, markets and livestock are whole-farm decisions. Per-paddock limits are kept as an idea in Next up."
    },
    {
      "what": "Livestock only gates the grazed pasture",
      "why": "Vetch is grown for hay and oats for grain or hay, so both can be sold without animals."
    },
    {
      "what": "A thin crop list warns but never blocks",
      "why": "Some farms really do grow only cereals. The farmer sees the cost (disease, nitrogen, falling soil health) and decides."
    },
    {
      "what": "Everything ticked by default (incl. livestock)",
      "why": "Existing plans and the demo farm keep working unchanged. New farmers see the choice right after About You."
    },
    {
      "what": "Pictures at 10 m from Sentinel-2; analysis stays on NASA HLS 30 m",
      "why": "HLS gives about twice the clear looks (Landsat + Sentinel) and is what the classifier is validated on. Sharper pictures help farmers trust what they see without changing any validated numbers."
    },
    {
      "what": "Flowering picture chosen by visible yellowness, with a 1.2× bonus for 10 m",
      "why": "The flower index is relative to the scene, so it under-rates full bloom late in the season. Measuring (R+G)/2 − B over the detected canola matched what the eye sees (19 Aug 77, 8 Sep 65, 1 Aug 43). 10 m wins if it looks at least ~83% as yellow."
    },
    {
      "what": "Analysis method is chosen by validation; the UI always shows the clearest picture",
      "why": "The user said “for analysis, use what’s best; just in the UI, show the clearer image”."
    },
    {
      "what": "Read paddocks from pure pixels (≥ 6, else all)",
      "why": "Validated on whole USDA fields in two seasons: +5 to +17 points crop-type accuracy on fields of 5 ha and more. Own-canola exclusion still uses every pixel so edge pixels can’t raise false blackleg alarms."
    },
    {
      "what": "Neighbour-canola map stays on NASA HLS 30 m",
      "why": "Tested Sentinel-2 10 m with the same detector: recall 45.7% vs 73.4% (2021) and 58.5% vs 91.9% (2020). Not the cloud mask (yellow canola is labelled clear vegetation)."

    {
      "what": "Backend = Supabase (auth, Postgres with row-level security, Edge Functions)",
      "why": "The user’s choice: free tier, no server of our own. Start with one JSON document per farm that mirrors the current store; normalise only where we query (diary)."
    },
    {
      "what": "Manami AI via OpenRouter, only through a Supabase function",
      "why": "The OpenRouter key must never reach the browser. Free models; per-user daily cap; the built-in replies stay as tips and fallback."
    },
    {
      "what": "Daily weather from Open-Meteo forecast + NASA POWER normal",

    {
      "what": "Background loading instead of full-screen loaders",
      "why": "The satellite read (~30 s) and SoilGrids (~5 requests/min) used to block the screen. Now they run in the background with progress in the top bar and in place, and the plan refines as data arrives."

    {

<script>
(function () {
  const data = JSON.parse(document.getElementById('tracker-data').textContent);
  const app = document.getElementById('app');

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') n.className = v;
      else if (k === 'style') n.style.cssText = v;
      else n.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : String(k));
    return n;
  }
  const chip = (text, tone) => el('span', { class: 'chip' + (tone ? ' chip--' + tone : '') }, text);
  const section = (eyebrow, title, ...body) => el('section', { class: 'block' }, el('span', { class: 'eyebrow' }, eyebrow), title ? el('h2', {}, title) : null, ...body);
  const fmtDate = (iso) => new Date(iso + 'T12:00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch { /* storage blocked */ } },
  };

  const open = data.next.filter((n) => n.status !== 'done' && n.status !== 'idea');

  // ---- hero
  app.append(el('section', { class: 'hero', style: 'grid-template-columns:1fr' },
    el('div', {},
      el('span', { class: 'eyebrow' }, 'Project tracker'),
      el('h1', {}, 'Where we ', el('span', {}, 'left off')),
      el('p', { class: 'lead' }, data.summary),
      el('div', { class: 'chips' }, chip('Updated ' + fmtDate(data.updated), 'olive'), chip(data.phase, 'gold')),
      el('div', { class: 'stats' },
        el('div', { class: 'stat' }, el('b', {}, open.length), el('span', {}, 'to do next')),
        el('div', { class: 'stat' }, el('b', {}, data.discuss.length), el('span', {}, 'questions to discuss')),
        el('div', { class: 'stat' }, el('b', {}, data.milestones.length), el('span', {}, 'milestones done')),
        el('div', { class: 'stat' }, el('b', {}, data.sessions.length), el('span', {}, data.sessions.length === 1 ? 'session so far' : 'sessions so far'))))));

  // ---- resume
  const notes = el('textarea', { id: 'notes', placeholder: 'Anything Claude should know next time: what the team decided, what to do first… (saved in this browser only)' });
  notes.value = store.get('sheeep-tracker:notes');
  notes.addEventListener('input', () => store.set('sheeep-tracker:notes', notes.value));
  const copyBtn = el('button', { class: 'btn', type: 'button' }, 'Copy prompt + my notes');
  copyBtn.addEventListener('click', async () => {
    const text = data.resumePrompt + (notes.value.trim() ? '\n\nMy notes since last time:\n' + notes.value.trim() : '');
    copyBtn.textContent = (await window.sheeepCopy(text)) ? 'Copied! Paste it into Claude' : 'Select and copy manually';
    setTimeout(() => (copyBtn.textContent = 'Copy prompt + my notes'), 2200);
  });
  app.append(el('section', { class: 'block', style: 'padding-top:28px' },
    el('div', { class: 'card resume' },
      el('h2', { style: 'font-size:24px' }, 'Continue in a new session'),
      el('div', { class: 'grid grid-2' },
        el('div', {},
          el('ol', {},
            el('li', {}, 'Open Claude Code in the ', el('code', {}, 'NASA'), ' folder.'),
            el('li', {}, 'Say “continue”. Claude reads this tracker first (', el('code', {}, 'CLAUDE.md'), ' tells it to).'),
            el('li', {}, 'Or copy the prompt with your notes and paste it in.')),
          el('pre', { 'data-copy': data.resumePrompt }, data.resumePrompt)),
        el('div', {},
          el('label', { for: 'notes', style: 'font-weight:700;display:block;margin-bottom:6px' }, 'Your notes for Claude'),
          notes,
          el('div', { style: 'margin-top:10px' }, copyBtn))))));

  // ---- next up + discuss
  const statusTone = { todo: 'teal', doing: 'gold', blocked: 'rose', done: 'olive', idea: null };
  const statusText = { todo: 'To do', doing: 'In progress', blocked: 'Blocked', done: 'Done', idea: 'Idea' };
  const nextList = el('div', { class: 'list' }, data.next.map((n) =>
    el('article', { class: 'card card--flat item' },
      el('div', { class: 'chips', style: 'margin:0' }, chip(statusText[n.status] || n.status, statusTone[n.status]), chip(n.size === 'Talk' ? 'Discussion' : 'Size ' + n.size)),
      el('h3', {}, n.title),
      el('p', { class: 'muted' }, n.detail),
      n.where.length ? el('div', { class: 'where' }, n.where.map((w) => el('code', {}, w))) : null)));
  const discussList = el('div', { class: 'list' }, data.discuss.map((d) =>
    el('article', { class: 'card card--flat q' }, el('h3', {}, d.q), el('p', {}, d.why))));
  app.append(el('section', { class: 'block' },
    el('div', { class: 'grid grid-2', style: 'align-items:start' },
      el('div', {}, el('span', { class: 'eyebrow' }, 'Next up'), el('h2', {}, 'What to do next'), nextList),
      el('div', {}, el('span', { class: 'eyebrow' }, 'To discuss'), el('h2', {}, 'Questions for the team'), discussList))));

  // ---- milestones
  app.append(section('Done so far', 'Milestones',
    el('div', { class: 'card' }, el('ol', { class: 'ms' }, data.milestones.map((m, i) =>
      el('li', {}, el('span', { class: 'n' }, '✓'), el('div', {}, el('h3', {}, (i + 1) + '. ' + m.title), el('p', {}, m.detail))))))));

  // ---- decisions
  app.append(section('Decisions', 'Already decided (and why)',
    el('div', { class: 'table-wrap' }, el('table', {},
      el('thead', {}, el('tr', {}, el('th', {}, 'Decision'), el('th', {}, 'Why'))),
      el('tbody', {}, data.decisions.map((d) => el('tr', {}, el('td', { style: 'font-weight:700' }, d.what), el('td', {}, d.why))))))));

  // ---- issues
  const kindTone = { limit: 'gold', slow: 'teal', bug: 'rose' };
  const kindText = { limit: 'Limit', slow: 'Slow', bug: 'Bug' };
  app.append(section('Known issues & limits', 'Good to know',
    el('div', { class: 'grid grid-3' }, data.issues.map((x) =>
      el('div', { class: 'card card--flat item' }, chip(kindText[x.kind] || x.kind, kindTone[x.kind]), el('h3', {}, x.title), el('p', { class: 'muted' }, x.detail))))));

  // ---- checks
  app.append(section('Check it still works', 'Commands',
    el('div', { class: 'grid grid-2' }, data.checks.map((c) =>
      el('div', {}, el('h3', { style: 'font-size:16px' }, c.what), el('pre', { 'data-copy': c.cmd }, c.cmd), c.note ? el('p', { class: 'small muted' }, c.note) : null)))));

  // ---- files
  app.append(section('Map of the code', 'Key files',
    el('div', { class: 'files' }, data.files.map((f) =>
      el('div', { class: 'card card--flat' }, el('h3', {}, f.area), el('div', {}, f.paths.map((p) => el('code', {}, p))))))));

  // ---- sessions
  app.append(section('Session log', 'History',
    el('div', { class: 'list' }, data.sessions.slice().reverse().map((s) =>
      el('article', { class: 'card session' },
        el('div', { class: 'chips', style: 'margin:0 0 6px' }, chip(s.date, 'olive')),
        el('h3', {}, s.title),
        el('ul', {}, s.did.map((d) => el('li', {}, d))),
        el('p', { class: 'small' }, el('strong', {}, 'Left off: '), s.leftOff))))));

  app.append(el('footer', { class: 'foot for-claude' },
    'For Claude: the data behind this page is the JSON in ', el('code', {}, '<script id="tracker-data">'),
    '. Update it at the end of each session and leave the markup alone. Notes typed above stay in this browser only; paste them into the chat so Claude sees them.'));
})();
</script>
